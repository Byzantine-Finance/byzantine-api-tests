name: CI/CD Pipeline to Byzantine API

on:
  pull_request:
    branches: [main, dev]
  repository_dispatch:
    types: [run-test-suite]
  workflow_dispatch:
    inputs:
      otp_approve:
        description: "OTP code for approve transaction (from email)"
        required: false
        type: string
      otp_deposit:
        description: "OTP code for deposit transaction (from email)"
        required: false
        type: string
      skip_jobs:
        description: "Comma-separated list of jobs to skip"
        required: false
        type: string
        default: ""

env:
  NODE_VERSION: "20"
  TEST_ENV: "development"
  CI: "true"

jobs:
  ############################
  # Job 1a: Foundation Tests
  ############################
  foundation-tests:
    name: Foundation Tests
    runs-on: ubuntu-latest
    environment: dev
    if: ${{ !contains(github.event.inputs.skip_jobs || '', 'setup-and-foundation') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run generate-schemas
      - run: npm run validate-schemas
      - name: Check for schema changes
        id: schema-changed
        run: |
          if git diff --quiet fixtures/__generated__/generated-schemas.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Upload schema changes
        if: ${{ steps.schema-changed.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: schema-changes
          path: fixtures/__generated__/generated-schemas.json

      - run: npm run test:api:health
      - run: npm run test:api:vaults

  ############################
  # Job 1b: Setup & Manual Intervention
  ############################
  setup-and-manual-intervention:
    name: Setup & Manual Intervention
    runs-on: ubuntu-latest
    needs: foundation-tests
    outputs:
      web_url: ${{ steps.tunnel.outputs.web_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Start server & Cloudflare tunnel
        id: tunnel
        run: |
          # Start server in background
          npm run serve &

          # Wait for server to be ready
          echo "⏳ Waiting for server to start..."
          timeout=30
          counter=0
          while ! node -e "require('http').get('http://localhost:3000/tests/web/api-testing.html', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" 2>/dev/null; do
            if [ $counter -ge $timeout ]; then
              echo "Server failed to start within $timeout seconds"
              exit 1
            fi
            sleep 1
            counter=$((counter+1))
          done

          # Start Cloudflare tunnel
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &
          sleep 5
          URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1 || echo "http://localhost:3000")
          echo "web_url=${URL}/tests/web/api-testing.html" >> $GITHUB_OUTPUT

          # Display notice for user
          echo "::notice::🌐 Web Interface ready: $URL/tests/web/api-testing.html"
          echo "═══════════════════════════════════════════════════════════════"
          echo "  🌐 Web Interface URL: $URL/tests/web/api-testing.html"
          echo "  📋 Please complete manual steps in the web interface"
          echo "  before continuing."
          echo "═══════════════════════════════════════════════════════════════"

      - name: Pause for manual intervention
        run: |
          echo "⏸️ Pausing workflow. Visit the URL above to accept the ToS."
          echo "You can cancel this step manually in GitHub UI if needed."
          # Sleep for 10 minutes
          sleep 180

      - name: Continue workflow
        run: |
          echo "✅ Manual intervention completed. Continuing workflow..."
          echo "Web URL: ${{ steps.tunnel.outputs.web_url }}"
          # Add any downstream steps here

  ############################
  # Job 2: Account Lifecycle
  ############################
  account-lifecycle:
    name: Account Lifecycle
    runs-on: ubuntu-latest
    environment: dev
    needs: setup-and-manual-intervention
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run test:api:create
      - run: npm run test:api:management
      - run: npm run test:api:accounts
      - uses: actions/upload-artifact@v4
        with:
          name: test-data-accounts
          path: fixtures/test-data/__generated__/generated-accounts.json

  ###################################
  # Job 3a: Passkey Init + Manual Approve
  ###################################
  passkey-init-approve:
    name: Passkey Init & Manual Approve
    runs-on: ubuntu-latest
    needs: account-lifecycle
    environment:
      name: passkey-approve-manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run test:api:init-passkey
      - name: Upload passkey transaction data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-data-passkey
          path: fixtures/test-data/__generated__/generated-tx-passkey.json
          retention-days: 1
      - run: |
          echo "::notice::Complete manual steps at ${{ needs.setup-and-manual-intervention.outputs.web_url }} before approval"

  ###################################
  # Job 3b: Passkey Approve Transaction
  ###################################
  passkey-approve-tx:
    name: Passkey Approve Transaction
    runs-on: ubuntu-latest
    needs: passkey-init-approve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Download passkey transaction data
        uses: actions/download-artifact@v4
        with:
          name: test-data-passkey
          path: fixtures/test-data/__generated__/
      - run: npm run test:api:transaction-passkey

  ###################################
  # Job 4a: Passkey Deposit Init + Manual Deposit
  ###################################
  passkey-init-deposit:
    name: Passkey Init Deposit & Manual Deposit
    runs-on: ubuntu-latest
    needs: passkey-approve-tx
    environment:
      name: passkey-deposit-manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Download passkey transaction data
        uses: actions/download-artifact@v4
        with:
          name: test-data-passkey
          path: fixtures/test-data/__generated__/
      - run: npm run test:api:init-passkey
      - name: Upload passkey transaction data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-data-passkey
          path: fixtures/test-data/__generated__/generated-tx-passkey.json
          retention-days: 1
      - run: |
          echo "::notice::Complete manual deposit steps at ${{ needs.setup-and-manual-intervention.outputs.web_url }} before approval"

  ###################################
  # Job 4b: Passkey Deposit Transaction
  ###################################
  passkey-deposit-tx:
    name: Passkey Deposit Transaction
    runs-on: ubuntu-latest
    needs: passkey-init-deposit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Download passkey transaction data
        uses: actions/download-artifact@v4
        with:
          name: test-data-passkey
          path: fixtures/test-data/__generated__/
      - run: npm run test:api:transaction-passkey

  ###################################
  # Job 5a: Passkey Withdraw Init + Manual Withdraw
  ###################################
  passkey-init-withdraw:
    name: Passkey Init Withdraw & Manual Withdraw
    runs-on: ubuntu-latest
    needs: passkey-deposit-tx
    environment:
      name: passkey-withdraw-manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Download passkey transaction data
        uses: actions/download-artifact@v4
        with:
          name: test-data-passkey
          path: fixtures/test-data/__generated__/
      - run: npm run test:api:init-passkey
      - name: Upload passkey transaction data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-data-passkey
          path: fixtures/test-data/__generated__/generated-tx-passkey.json
          retention-days: 1
      - run: |
          echo "::notice::Complete manual withdraw steps at ${{ needs.setup-and-manual-intervention.outputs.web_url }} before approval"

  ###################################
  # Job 5b: Passkey Withdraw Transaction
  ###################################
  passkey-withdraw-tx:
    name: Passkey Withdraw Transaction
    runs-on: ubuntu-latest
    needs: passkey-init-withdraw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Download passkey transaction data
        uses: actions/download-artifact@v4
        with:
          name: test-data-passkey
          path: fixtures/test-data/__generated__/
      - run: npm run test:api:transaction-passkey

  ###################################
  # Job 6: Transaction OTP + Final
  ###################################
  # TODO: Add transaction OTP tests
