name: CI/CD Pipeline to Byzantine API

on:
  pull_request:
    branches: [main, dev]
  # This workflow listens for events dispatched from other repositories
  repository_dispatch:
    types: [run-test-suite] # type of the event to trigger the workflow in the API repository
  workflow_dispatch: # Allow manual triggering
    inputs:
      otp_approve:
        description: "OTP code for approve transaction (from email)"
        required: false
        type: string
      otp_deposit:
        description: "OTP code for deposit transaction (from email)"
        required: false
        type: string
      skip_jobs:
        description: "Comma-separated list of jobs to skip (setup-and-foundation,account-lifecycle,transaction-passkey,transaction-otp-and-final)"
        required: false
        type: string
        default: ""

env:
  NODE_VERSION: "20"
  TEST_ENV: "development"
  CI: "true"

jobs:
  # Job 1: Setup & Foundation Tests
  setup-and-foundation:
    name: Setup & Foundation Tests
    runs-on: ubuntu-latest
    environment: dev
    if: ${{ !contains(github.event.inputs.skip_jobs || '', 'setup-and-foundation') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: npm run serve &
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}

      - name: Wait for server to be ready
        run: |
          timeout=30
          counter=0
          while ! node -e "require('http').get('http://localhost:3000/tests/web/api-testing.html', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" 2>/dev/null; do
            if [ $counter -ge $timeout ]; then
              echo "Server failed to start within $timeout seconds"
              exit 1
            fi
            echo "Waiting for server to start... ($counter/$timeout)"
            sleep 1
            counter=$((counter + 1))
          done
          echo "Server is ready on port 3000!"

      - name: Display web interface URL
        run: |
          echo "::notice title=Web Interface Available::🌐 Web interface is running at http://localhost:3000/tests/web/api-testing.html"
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  🌐 Web Interface URL:"
          echo "  http://localhost:3000/tests/web/api-testing.html"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "Note: The server is running in the background and will remain"
          echo "available for the duration of this job."

      - name: Generate schemas from OpenAPI
        run: npm run generate-schemas
        env:
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          OPENAPI_URL: ${{ vars.OPENAPI_URL }}

      - name: Validate generated schemas
        run: npm run validate-schemas

      - name: Check for schema changes
        id: schema-changed
        run: |
          if git diff --quiet fixtures/__generated__/generated-schemas.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload schema changes (if any)
        if: steps.schema-changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: schema-changes
          path: fixtures/__generated__/generated-schemas.json

      - name: Run health tests
        run: npm run test:api:health
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}

      - name: Run vault data tests
        run: npm run test:api:vaults
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}

  # Job 2: Account Lifecycle Tests
  account-lifecycle:
    name: Account Lifecycle Tests
    runs-on: ubuntu-latest
    environment: dev
    needs: setup-and-foundation
    if: ${{ !contains(github.event.inputs.skip_jobs || '', 'account-lifecycle') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run account creation tests
        run: npm run test:api:create
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          ENABLE_WRITE_TESTS: "true"
          ENABLE_AUTH_TESTS: "true"
          DEV_INTEGRATOR_PRIVATE_KEY: ${{ secrets.DEV_INTEGRATOR_PRIVATE_KEY }}

      - name: Run account management tests
        run: npm run test:api:management
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          ENABLE_WRITE_TESTS: "true"
          ENABLE_AUTH_TESTS: "true"
          DEV_INTEGRATOR_PRIVATE_KEY: ${{ secrets.DEV_INTEGRATOR_PRIVATE_KEY }}

      - name: Run account data tests
        run: npm run test:api:accounts
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          ENABLE_ACCOUNT_TESTS: "true"

      - name: Upload generated test data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-data-accounts
          path: fixtures/test-data/__generated__/generated-accounts.json
          retention-days: 1

  # Job 3: Transaction Tests (Passkey)
  transaction-passkey:
    name: Transaction Tests (Passkey)
    runs-on: ubuntu-latest
    environment: dev
    needs: account-lifecycle
    if: ${{ !contains(github.event.inputs.skip_jobs || '', 'transaction-passkey') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: npm run serve &
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}

      - name: Wait for server to be ready
        run: |
          timeout=30
          counter=0
          while ! node -e "require('http').get('http://localhost:3000/tests/web/api-testing.html', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" 2>/dev/null; do
            if [ $counter -ge $timeout ]; then
              echo "Server failed to start within $timeout seconds"
              exit 1
            fi
            echo "Waiting for server to start... ($counter/$timeout)"
            sleep 1
            counter=$((counter + 1))
          done
          echo "Server is ready on port 3000!"

      - name: Start tunnel and expose URL
        id: start-tunnel
        run: |
          echo "Installing cloudflared to expose web interface..."
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          
          echo "Starting tunnel in background..."
          ./cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV
          
          echo "Waiting for tunnel to be ready..."
          sleep 5
          
          # Extract the public URL from cloudflared output
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1 || echo "")
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "⚠️  Could not extract tunnel URL, using localhost instead"
            TUNNEL_URL="http://localhost:3000"
          fi
          
          WEB_URL="${TUNNEL_URL}/tests/web/api-testing.html"
          echo "TUNNEL_URL=${TUNNEL_URL}" >> $GITHUB_ENV
          echo "WEB_URL=${WEB_URL}" >> $GITHUB_ENV
          
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  ✅ Tunnel started successfully!"
          echo "  🌐 Web Interface URL: $WEB_URL"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "::notice title=Tunnel Ready::🌐 $WEB_URL"

      - name: Run passkey init approve tests
        run: npm run test:api:init-passkey
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          ENABLE_PASSKEY_TESTS: "true"
          ENABLE_PASSKEY_INIT_APPROVE_TESTS: "true"
          CHAIN: ${{ vars.CHAIN || 'BASE' }}
          TEST_VAULT_BASE: ${{ vars.TEST_VAULT_BASE }}
          TEST_VAULT_ETH: ${{ vars.TEST_VAULT_ETH }}

      - name: Manual intervention - Approve
        environment: 
          name: passkey-approve-manual
          url: ${{ env.WEB_URL }}
        run: |
          echo "::notice title=Manual Interaction Required (Approve)::⏸️  Please complete manual steps for Approve transaction"
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  📋 Manual Steps Required: Approve Transaction"
          echo "  🌐 Web Interface: ${{ env.WEB_URL }}"
          echo ""
          echo "  Please complete the required manual steps in the web interface"
          echo "  before approving this step to continue."
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "Waiting for approval to continue with approve transaction tests..."

      - name: Run passkey transaction approve tests
        run: npm run test:api:transaction-passkey
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          ENABLE_PASSKEY_TESTS: "true"
          ENABLE_PASSKEY_APPROVE_TX_TESTS: "true"
          CHAIN: ${{ vars.CHAIN || 'BASE' }}
          TEST_VAULT_BASE: ${{ vars.TEST_VAULT_BASE }}
          TEST_VAULT_ETH: ${{ vars.TEST_VAULT_ETH }}
          DEV_INTEGRATOR_PRIVATE_KEY: ${{ secrets.DEV_INTEGRATOR_PRIVATE_KEY }}

      - name: Run passkey init deposit tests
        run: npm run test:api:init-passkey
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          ENABLE_PASSKEY_TESTS: "true"
          ENABLE_PASSKEY_INIT_DEPOSIT_TESTS: "true"
          CHAIN: ${{ vars.CHAIN || 'BASE' }}
          TEST_VAULT_BASE: ${{ vars.TEST_VAULT_BASE }}
          TEST_VAULT_ETH: ${{ vars.TEST_VAULT_ETH }}

      - name: Manual intervention - Deposit
        environment: 
          name: passkey-deposit-manual
          url: ${{ env.WEB_URL }}
        run: |
          echo "::notice title=Manual Interaction Required (Deposit)::⏸️  Please complete manual steps for Deposit transaction"
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  📋 Manual Steps Required: Deposit Transaction"
          echo "  🌐 Web Interface: ${{ env.WEB_URL }}"
          echo ""
          echo "  Please complete the required manual steps in the web interface"
          echo "  before approving this step to continue."
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "Waiting for approval to continue with deposit transaction tests..."

      - name: Run passkey transaction deposit tests
        run: npm run test:api:transaction-passkey
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          ENABLE_PASSKEY_TESTS: "true"
          ENABLE_PASSKEY_DEPOSIT_TX_TESTS: "true"
          CHAIN: ${{ vars.CHAIN || 'BASE' }}
          TEST_VAULT_BASE: ${{ vars.TEST_VAULT_BASE }}
          TEST_VAULT_ETH: ${{ vars.TEST_VAULT_ETH }}
          DEV_INTEGRATOR_PRIVATE_KEY: ${{ secrets.DEV_INTEGRATOR_PRIVATE_KEY }}

      - name: Run passkey init withdraw tests
        run: npm run test:api:init-passkey
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          ENABLE_PASSKEY_TESTS: "true"
          ENABLE_PASSKEY_INIT_WITHDRAW_TESTS: "true"
          CHAIN: ${{ vars.CHAIN || 'BASE' }}
          TEST_VAULT_BASE: ${{ vars.TEST_VAULT_BASE }}
          TEST_VAULT_ETH: ${{ vars.TEST_VAULT_ETH }}

      - name: Manual intervention - Withdraw
        environment: 
          name: passkey-withdraw-manual
          url: ${{ env.WEB_URL }}
        run: |
          echo "::notice title=Manual Interaction Required (Withdraw)::⏸️  Please complete manual steps for Withdraw transaction"
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  📋 Manual Steps Required: Withdraw Transaction"
          echo "  🌐 Web Interface: ${{ env.WEB_URL }}"
          echo ""
          echo "  Please complete the required manual steps in the web interface"
          echo "  before approving this step to continue."
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "Waiting for approval to continue with withdraw transaction tests..."

      - name: Run passkey transaction withdraw tests
        run: npm run test:api:transaction-passkey
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          ENABLE_PASSKEY_TESTS: "true"
          ENABLE_PASSKEY_WITHDRAW_TX_TESTS: "true"
          CHAIN: ${{ vars.CHAIN || 'BASE' }}
          TEST_VAULT_BASE: ${{ vars.TEST_VAULT_BASE }}
          TEST_VAULT_ETH: ${{ vars.TEST_VAULT_ETH }}
          DEV_INTEGRATOR_PRIVATE_KEY: ${{ secrets.DEV_INTEGRATOR_PRIVATE_KEY }}

      - name: Upload passkey transaction data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-data-passkey
          path: fixtures/test-data/__generated__/generated-tx-passkey.json
          retention-days: 1

      - name: Run transaction data tests
        run: npm run test:api:transaction-data
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          CHAIN: ${{ vars.CHAIN || 'BASE' }}
          TEST_VAULT_BASE: ${{ vars.TEST_VAULT_BASE }}
          TEST_VAULT_ETH: ${{ vars.TEST_VAULT_ETH }}

      - name: Cleanup tunnel
        if: always()
        run: |
          if [ -n "$TUNNEL_PID" ]; then
            echo "Stopping tunnel (PID: $TUNNEL_PID)..."
            kill $TUNNEL_PID 2>/dev/null || true
          fi
          echo "✅ Cleanup complete"

  # Job 4: Transaction Tests (OTP) + Final
  transaction-otp-and-final:
    name: Transaction Tests (OTP) + Final
    runs-on: ubuntu-latest
    environment: dev
    needs: transaction-passkey
    if: ${{ !contains(github.event.inputs.skip_jobs || '', 'transaction-otp-and-final') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download test data
        uses: actions/download-artifact@v4
        with:
          name: test-data-accounts
          path: fixtures/test-data/__generated__/

      - name: Download passkey transaction data
        uses: actions/download-artifact@v4
        with:
          name: test-data-passkey
          path: fixtures/test-data/__generated__/

      - name: Run OTP init approve tests
        run: npm run test:api:init-otp
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          ENABLE_OTP_TESTS: "true"
          ENABLE_OTP_INIT_APPROVE_TESTS: "true"
          CHAIN: ${{ vars.CHAIN || 'BASE' }}
          TEST_VAULT_BASE: ${{ vars.TEST_VAULT_BASE }}
          TEST_VAULT_ETH: ${{ vars.TEST_VAULT_ETH }}

      - name: Run OTP transaction approve tests
        run: npm run test:api:transaction-otp
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          ENABLE_OTP_TESTS: "true"
          ENABLE_OTP_APPROVE_TX_TESTS: "true"
          OTP_APPROVE: ${{ inputs.otp_approve || secrets.OTP_APPROVE || '' }}
          CHAIN: ${{ vars.CHAIN || 'BASE' }}
          TEST_VAULT_BASE: ${{ vars.TEST_VAULT_BASE }}
          TEST_VAULT_ETH: ${{ vars.TEST_VAULT_ETH }}
          DEV_INTEGRATOR_PRIVATE_KEY: ${{ secrets.DEV_INTEGRATOR_PRIVATE_KEY }}

      - name: Run OTP init deposit tests
        run: npm run test:api:init-otp
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          ENABLE_OTP_TESTS: "true"
          ENABLE_OTP_INIT_DEPOSIT_TESTS: "true"
          CHAIN: ${{ vars.CHAIN || 'BASE' }}
          TEST_VAULT_BASE: ${{ vars.TEST_VAULT_BASE }}
          TEST_VAULT_ETH: ${{ vars.TEST_VAULT_ETH }}

      - name: Run OTP transaction deposit tests
        run: npm run test:api:transaction-otp
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          ENABLE_OTP_TESTS: "true"
          ENABLE_OTP_DEPOSIT_TX_TESTS: "true"
          OTP_DEPOSIT: ${{ inputs.otp_deposit || secrets.OTP_DEPOSIT || '' }}
          CHAIN: ${{ vars.CHAIN || 'BASE' }}
          TEST_VAULT_BASE: ${{ vars.TEST_VAULT_BASE }}
          TEST_VAULT_ETH: ${{ vars.TEST_VAULT_ETH }}
          DEV_INTEGRATOR_PRIVATE_KEY: ${{ secrets.DEV_INTEGRATOR_PRIVATE_KEY }}

      - name: Run transaction data tests
        run: npm run test:api:transaction-data
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          ENABLE_ACCOUNT_TESTS: "true"
          CHAIN: ${{ vars.CHAIN || 'BASE' }}
          TEST_VAULT_BASE: ${{ vars.TEST_VAULT_BASE }}
          TEST_VAULT_ETH: ${{ vars.TEST_VAULT_ETH }}
