<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Byzantine API Testing Widget</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, sans-serif;
        background: #fff;
        padding: 20px;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
      }

      h1 {
        margin-bottom: 20px;
      }

      .section {
        margin-bottom: 20px;
      }

      .section-title {
        font-weight: 600;
        margin-bottom: 10px;
        padding-bottom: 5px;
        border-bottom: 1px solid #000;
      }

      .input-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
      }

      input,
      textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #000;
        font-size: 14px;
        font-family: monospace;
      }

      textarea {
        min-height: 100px;
      }

      button {
        background: #000;
        color: #fff;
        border: none;
        padding: 10px 20px;
        font-size: 14px;
        cursor: pointer;
        width: 100%;
      }

      button:disabled {
        background: #999;
        cursor: not-allowed;
      }

      .result {
        margin-top: 20px;
        padding: 15px;
        font-size: 14px;
        white-space: pre-wrap;
        word-break: break-all;
        font-family: monospace;
        border: 1px solid #000;
      }

      .result.success {
        background: #f0f0f0;
      }

      .result.error {
        background: #f0f0f0;
      }

      .result.info {
        background: #f0f0f0;
      }

      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        border-bottom: 1px solid #000;
      }

      .tab {
        padding: 10px 20px;
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        cursor: pointer;
        font-size: 14px;
        color: #000;
      }

      .tab.active {
        border-bottom-color: #000;
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }

      .hint {
        margin-top: 6px;
        font-size: 12px;
        font-family: monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>API Testing Widget</h1>

      <div class="tabs">
        <button class="tab active" data-tab="create">Create Passkey</button>
        <button class="tab" data-tab="sign">Sign with Passkey</button>
      </div>

      <!-- Create Passkey Tab -->
      <div id="create-tab" class="tab-content active">
        <div class="section">
          <div class="input-group">
            <label for="userId">User ID</label>
            <input type="text" id="userId" placeholder="user-123" />
          </div>

          <div class="input-group">
            <label for="userEmail">User Email</label>
            <input type="email" id="userEmail" placeholder="user@example.com" />
          </div>

          <div class="input-group">
            <label for="userName">User Name</label>
            <input type="text" id="userName" placeholder="John Doe" />
          </div>

          <div class="input-group">
            <label for="rpIdCreate">Relying Party ID (your domain)</label>
            <input
              type="text"
              id="rpIdCreate"
              placeholder="localhost"
              value="localhost"
            />
          </div>

          <div class="input-group">
            <label for="rpNameCreate">Relying Party Name</label>
            <input
              type="text"
              id="rpNameCreate"
              placeholder="My App"
              value="Byzantine Test"
            />
          </div>
        </div>

        <button id="createBtn">Create Passkey</button>

        <div id="createResult"></div>
      </div>

      <!-- Sign with Passkey Tab -->
      <div id="sign-tab" class="tab-content">
        <div class="section">
          <div class="input-group">
            <label for="credentialId"> Credential ID (optional) </label>
            <input
              type="text"
              id="credentialId"
              placeholder="Leave empty to use discoverable credentials"
              value=""
            />
          </div>

          <div class="input-group">
            <label for="rpId">Relying Party ID</label>
            <input
              type="text"
              id="rpId"
              placeholder="localhost"
              value="localhost"
            />
          </div>

          <div class="input-group">
            <label for="rpName">Relying Party Name</label>
            <input
              type="text"
              id="rpName"
              placeholder="My App"
              value="Byzantine Test"
            />
          </div>
          <div class="input-group">
            <label for="txType">Transaction Type</label>
            <!-- Options are filled from GET /tx-types (TX_PASSKEY_TYPES in
                 utils/test-data-persistence.js) so this list always matches
                 what the server and saveBodyToSign() accept. -->
            <select id="txType"></select>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Payload to Sign</div>

          <div class="input-group">
            <label for="payload">Payload (JSON)</label>
            <textarea
              id="payload"
              placeholder="Loaded from generated-tx-passkey.json"
            ></textarea>
            <div id="payloadHint" class="hint"></div>
          </div>
        </div>

        <button id="testBtn">Sign payload</button>

        <div id="result"></div>
      </div>

    </div>

    <script type="module">
      // Import only the WebauthnStamper directly to avoid Node.js dependencies
      // Root-absolute so the page works both at / and at
      // /tests/web/api-testing.html (a relative "./node_modules" resolves to
      // /tests/web/node_modules and 404s).
      import { WebauthnStamper } from "/node_modules/@byzantine/integrator-sdk/dist/esm/webauthn-stamper/index.js";
      // SDK 1.15.0 still returns the raw rawId (base64url, no CBOR wrapping)
      // from createPasskey/getStamp, so no credential-ID conversion helpers are needed.

      // Load user data from JSON
      fetch("/fixtures/test-data/users/valid-user.json")
        .then((r) => r.json())
        .then((d) => {
          const email = d.userInfo.email || "";
          document.getElementById("userEmail").value = email;
          document.getElementById("userName").value =
            d.userInfo.firstName || "";
          document.getElementById("userId").value = email.split("@")[0] || "";
        })
        .catch(() => {});

      fetch("/fixtures/test-data/__generated__/generated-new-auth.json")
        .then((r) => r.json())
        .then((d) => {
          if (d.credentialId) {
            document.getElementById("credentialId").value = d.credentialId;
          }
        })
        .catch(() => {});

      const txTypeSelect = document.getElementById("txType");

      // Fill the dropdown from the server's canonical list. Falls back to the
      // keys already present in the fixture if /tx-types is unreachable (e.g.
      // the file opened straight off disk instead of through serve.js).
      async function loadTxTypes() {
        let types;
        try {
          const r = await fetch("/tx-types");
          if (!r.ok) throw new Error(r.status);
          types = await r.json();
        } catch (e) {
          const r = await fetch(
            "/fixtures/test-data/__generated__/generated-tx-passkey.json",
          ).catch(() => null);
          const data = r && r.ok ? await r.json() : {};
          types = Object.keys(data).map((type) => ({ type, label: type }));
        }

        txTypeSelect.innerHTML = "";
        for (const { type, label } of types) {
          const option = document.createElement("option");
          option.value = type;
          option.textContent = label || type;
          txTypeSelect.appendChild(option);
        }
      }

      // Load default transaction payload from generated fixtures
      function loadPayloadForCurrentType() {
        const txType = txTypeSelect ? txTypeSelect.value : "deposit";
        const payloadTextarea = document.getElementById("payload");
        const hint = document.getElementById("payloadHint");
        if (!payloadTextarea) return;

        // Cache-bust: the fixture is rewritten by the init-* tests while this
        // page stays open, and a 304 would hand back the previous payload.
        fetch(
          `/fixtures/test-data/__generated__/generated-tx-passkey.json?t=${Date.now()}`,
        )
          .then((r) => r.json())
          .then((data) => {
            const entry = data?.[txType];
            const bodyToSign = entry?.bodyToSign;

            // A `_note` marks a placeholder entry the init test has never
            // overwritten. Signing it would stamp a fake payload and only fail
            // later at submit, so treat it as "nothing to sign yet".
            if (!bodyToSign || entry._note) {
              payloadTextarea.value = "";
              hint.textContent = entry?._note
                ? `⚠️ No real "${txType}" payload yet.\n${entry._note}`
                : `⚠️ No "${txType}" payload saved yet — run the matching init-passkey test first, then reselect this type.`;
              return;
            }

            payloadTextarea.value = JSON.stringify(bodyToSign, null, 2);

            // Turnkey rejects a stamp over a stale payload, so surface the age
            // of what is about to be signed.
            const ageMs = Date.now() - Number(bodyToSign.timestampMs);
            const ageMin = Math.round(ageMs / 60000);
            const stale = Number.isFinite(ageMin) && ageMin > 10;
            hint.textContent = [
              entry.transactionId
                ? `transactionId: ${entry.transactionId}`
                : "no transactionId (invite-users and role-update payloads don't get one)",
              Number.isFinite(ageMin)
                ? `payload age: ${ageMin} min${stale ? " ⚠️ likely stale — re-run the init test" : ""}`
                : "",
              entry.webAuthnStamp ? "already signed once (will overwrite)" : "",
            ]
              .filter(Boolean)
              .join("\n");
          })
          .catch(() => {
            hint.textContent =
              "⚠️ Could not read generated-tx-passkey.json — is serve.js running?";
          });
      }

      if (txTypeSelect) {
        txTypeSelect.addEventListener("change", loadPayloadForCurrentType);
      }
      loadTxTypes().then(loadPayloadForCurrentType);

      // Tab switching functionality
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          const tabName = tab.dataset.tab;

          // Update active tab
          document
            .querySelectorAll(".tab")
            .forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");

          // Update active content
          document.querySelectorAll(".tab-content").forEach((content) => {
            content.classList.remove("active");
          });
          document.getElementById(`${tabName}-tab`).classList.add("active");
        });
      });

      // Create Passkey functionality
      async function createPasskey() {
        const resultDiv = document.getElementById("createResult");
        const createBtn = document.getElementById("createBtn");

        try {
          createBtn.disabled = true;
          createBtn.textContent = "⏳ Creating...";
          resultDiv.innerHTML = "";

          // Get values from inputs
          const userId = document.getElementById("userId").value.trim();
          const userEmail = document.getElementById("userEmail").value.trim();
          const userName = document.getElementById("userName").value.trim();
          const rpId = document.getElementById("rpIdCreate").value.trim();
          const rpName = document.getElementById("rpNameCreate").value.trim();

          // Validate inputs
          if (!userId || !userEmail || !userName || !rpId || !rpName) {
            throw new Error("All fields are required");
          }

          resultDiv.innerHTML =
            '<div class="result info">Creating passkey...</div>';

          // Create stamper with required configuration
          const stamper = new WebauthnStamper({
            rpId: rpId,
            rpName: rpName,
            timeout: 60000,
            userVerification: "preferred",
            residentKey: "preferred",
            requireResidentKey: false,
          });

          // Generate a random challenge
          const challenge = crypto.getRandomValues(new Uint8Array(32));

          // Create passkey configuration
          const creationConfig = {
            userId: userId,
            userEmail: userEmail,
            userName: userName,
            challenge: challenge,
          };

          // Create the passkey
          const { attestationData, challengeFromClientData } =
            await stamper.createPasskey(creationConfig);

          // SDK 1.15.0's createPasskey already returns attestationData.credentialId
          // as the raw WebAuthn rawId (base64url, no CBOR wrapping — see
          // webauthn-stamper/passkey.js). Use it directly; the account-creation /
          // create-authenticators API and signing assertions both expect this raw id.
          const rawCredentialId = attestationData.credentialId;

          // Display success result
          const result = {
            success: true,
            credentialId: rawCredentialId,
            attestationData: attestationData,
            challengeFromClientData: challengeFromClientData,
            timestamp: new Date().toISOString(),
          };

          resultDiv.innerHTML = `<div class="result success">✅ Passkey Created Successfully!

      <strong>Credential ID:</strong>
      ${result.credentialId}

      <strong>User Information:</strong>
      - User ID: ${userId}
      - Email: ${userEmail}
      - Name: ${userName}

      <strong>Relying Party:</strong>
      - RP ID: ${rpId}
      - RP Name: ${rpName}

      <strong>Timestamp:</strong>
      ${result.timestamp}

      <strong>⚠️ IMPORTANT:</strong>
      This is the raw credential ID — store it in your DB / send it as
      attestation.credentialId in rootUsers.authenticators. It's also been
      auto-filled into the Sign tab.`;

          // Auto-fill the credential ID in the sign tab. It's the raw rawId —
          // the same value stored in the DB and passed straight to getStamp().
          document.getElementById("credentialId").value = rawCredentialId;

          // Save to generated-new-auth.json. attestation.credentialId is sent
          // to the account-creation / create-authenticators API as the raw rawId.
          try {
            const newAuthData = {
              authenticators: [
                {
                  authenticatorName: "Passkey",
                  challenge: challengeFromClientData,
                  attestation: {
                    credentialId: rawCredentialId,
                    clientDataJson: attestationData.clientDataJson,
                    attestationObject: attestationData.attestationObject,
                    transports: attestationData.transports || [
                      "AUTHENTICATOR_TRANSPORT_INTERNAL",
                    ],
                  },
                },
              ],
              credentialId: rawCredentialId,
            };

            const saveResponse = await fetch("/save-new-auth", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(newAuthData),
            });

            const responseText = await saveResponse.text();
            console.log("Server response status:", saveResponse.status);
            console.log("Server response:", responseText);

            if (saveResponse.ok) {
              try {
                const saveResult = JSON.parse(responseText);
                console.log(
                  "✅ Passkey data saved to generated-new-auth.json",
                  saveResult,
                );
              } catch (e) {
                console.log("✅ Passkey data saved (non-JSON response)");
              }
            } else {
              try {
                const errorData = JSON.parse(responseText);
                console.error("⚠️ Failed to save passkey data:", errorData);
              } catch (e) {
                console.error(
                  "⚠️ Failed to save passkey data. Status:",
                  saveResponse.status,
                  "Response:",
                  responseText
                );
              }
            }
          } catch (saveError) {
            console.error("⚠️ Error saving passkey data:", saveError);
          }

          // Log to console for easy copying
          console.log("Passkey Creation Result:", result);
        } catch (error) {
          console.error("Error:", error);

          let errorMessage = error.message;
          let helpText = "";

          // Provide helpful error messages
          if (error.name === "NotAllowedError") {
          } else if (error.name === "SecurityError") {
            helpText =
              "\n\n💡 Security Error - Make sure:\n- Page is served over HTTPS (or localhost)\n- rpId matches your domain";
          } else if (error.name === "NotSupportedError") {
            helpText = "\n\n💡 WebAuthn is not supported in this browser";
          } else if (error.name === "InvalidStateError") {
            helpText = "\n\n💡 A passkey with this user ID may already exist";
          }

          resultDiv.innerHTML = `<div class="result error">❌ Error: ${errorMessage}${helpText}
              </div>`;
        } finally {
          createBtn.disabled = false;
          createBtn.textContent = "Create Passkey";
        }
      }

      // Sign with Passkey functionality
      async function getWebauthnStamper() {
        const resultDiv = document.getElementById("result");
        const testBtn = document.getElementById("testBtn");

        try {
          testBtn.disabled = true;
          testBtn.textContent = "Processing...";
          resultDiv.innerHTML = "";

          // Get values from inputs
          const credentialId = document
            .getElementById("credentialId")
            .value.trim();
          const rpId = document.getElementById("rpId").value.trim();
          const rpName = document.getElementById("rpName").value.trim();
          const txType = document.getElementById("txType").value;
          const payloadText = document.getElementById("payload").value.trim();

          // Validate inputs
          if (!rpId || !rpName) {
            throw new Error("Relying Party ID and Name are required");
          }

          // Parse and validate JSON
          let payloadObj;
          try {
            payloadObj = JSON.parse(payloadText);
          } catch (e) {
            throw new Error("Invalid JSON in payload: " + e.message);
          }

          // Determine mode based on credential ID
          const mode = credentialId ? "specific" : "discoverable";
          const modeText = credentialId
            ? `Using specific credential: ${credentialId.substring(0, 20)}...`
            : "Using discoverable credentials (browser will show all available passkeys)";

          resultDiv.innerHTML = `<div class="result info">🔄 Initializing WebAuthn Stamper...\n\nMode: ${modeText}</div>`;

          // Create stamper configuration
          const stamper = new WebauthnStamper({
            rpId: rpId,
            rpName: rpName,
            timeout: 60000,
            userVerification: "preferred",
            residentKey: "preferred",
            requireResidentKey: false,
          });

          // Get the stamp - with or without credential ID
          const payload = JSON.stringify(payloadObj);
          let stamp;
          if (credentialId) {
            // Non-discoverable: specify the credential ID. SDK 1.15.0's getStamp()
            // expects the raw rawId (base64url) directly — it no longer CBOR-wraps
            // (see webauthn-stamper/index.js). Pass the stored raw id straight through.
            stamp = await stamper.getStamp(payload, [credentialId]);
          } else {
            // Discoverable: let browser show all available passkeys
            stamp = await stamper.getStamp(payload);
          }

          // Persist the WebAuthn stamp header value for reuse in API tests
          let saveNote = `Saved to generated-tx-passkey.json → ${txType}.webAuthnStamp`;
          try {
            const saveRes = await fetch("/save-passkey-stamp", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                transactionType: txType,
                webAuthnStamp: stamp.stampHeaderValue,
              }),
            });
            if (!saveRes.ok) {
              const body = await saveRes.text();
              saveNote = `⚠️ NOT saved (${saveRes.status}): ${body}`;
            }
          } catch (e) {
            console.error("Failed to save WebAuthn stamp:", e);
            saveNote = `⚠️ NOT saved: ${e.message}`;
          }

          // Display success result
          const result = {
            success: true,
            mode: mode,
            stampHeaderName: stamp.stampHeaderName,
            stampHeaderValue: stamp.stampHeaderValue,
            payload: payloadObj,
            timestamp: new Date().toISOString(),
          };

          const credentialInfo = credentialId
            ? `<strong>Credential ID Used:</strong>\n${credentialId}\n\n<strong>Mode:</strong> Non-discoverable (specific credential)`
            : `<strong>Mode:</strong> Discoverable credentials (browser selected from available passkeys)`;

          resultDiv.innerHTML = `<div class="result success">✅ WebAuthn Stamp Generated Successfully!

      <strong>Stamp Header Name:</strong>
      ${stamp.stampHeaderName}

      <strong>Stamp Header Value:</strong>
      ${stamp.stampHeaderValue}

      <strong>Transaction Type:</strong>
      ${txType} — ${saveNote}

      ${credentialInfo}

      <strong>Payload Signed:</strong>
      ${JSON.stringify(payloadObj, null, 2)}

      <strong>Timestamp:</strong>
      ${result.timestamp}
     </div>`;

          // Log to console for easy copying
          console.log("WebAuthn Stamp Result:", result);
        } catch (error) {
          console.error("Error:", error);

          let errorMessage = error.message;
          let helpText = "";

          // Provide helpful error messages
          if (error.name === "NotAllowedError") {
            helpText =
              "\n\n💡 This usually means:\n- User cancelled the authentication\n- Timeout occurred\n- Credential not found (try leaving Credential ID empty for discoverable mode)";
          } else if (error.name === "SecurityError") {
            helpText =
              "\n\n💡 Security Error - Make sure:\n- Page is served over HTTPS (or localhost)\n- rpId matches your domain\n- Credential was registered for this domain";
          } else if (error.name === "NotSupportedError") {
            helpText = "\n\n💡 WebAuthn is not supported in this browser";
          }

          resultDiv.innerHTML = `<div class="result error">❌ Error: ${errorMessage}${helpText}</div>`;
        } finally {
          testBtn.disabled = false;
          testBtn.textContent = "Sign payload";
        }
      }

      // Add click event listeners
      document
        .getElementById("createBtn")
        .addEventListener("click", createPasskey);
      document
        .getElementById("testBtn")
        .addEventListener("click", getWebauthnStamper);
    </script>
  </body>
</html>
